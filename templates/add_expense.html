{% extends "base.html" %}

{% block title %}Add Expense - Spendly{% endblock %}

{% block content %}
<div class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <h2>Add New Expense</h2>
            <p class="auth-subtitle">Keep your spending on track by recording a new transaction.</p>

            {% if error %}
            <div class="auth-error">
                {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('add_expense') }}" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" step="0.01" name="amount" id="amount" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select name="category" id="category" required>
                        <option value="" disabled selected>Select a category</option>
                        {% for cat in categories %}
                        <option value="{{ cat }}">{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" name="date" id="date" value="{{ default_date }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <input type="text" name="description" id="description" placeholder="What was this for?">
                </div>

                <button type="submit" class="btn-submit">Save Expense</button>
            </form>

            <div class="auth-footer">
                <a href="{{ url_for('profile') }}">Back to Profile</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
