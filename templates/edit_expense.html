{% extends "base.html" %}

{% block title %}Edit Expense - Spendly{% endblock %}

{% block content %}
<div class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <h2>Edit Expense</h2>
            <p class="auth-subtitle">Modify the details of your recorded transaction.</p>

            {% if error %}
            <div class="auth-error">
                {{ error }}
            </div>
            {% endif %}

            <form action="{{ url_for('edit_expense', id=expense['id']) }}" method="POST" class="auth-form">
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" step="0.01" name="amount" id="amount" value="{{ expense['amount'] }}" required>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select name="category" id="category" required>
                        {% for cat in categories %}
                        <option value="{{ cat }}" {% if cat == expense['category'] %}selected{% endif %}>{{ cat }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" name="date" id="date" value="{{ expense['date'] }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Description (Optional)</label>
                    <input type="text" name="description" id="description" value="{{ expense['description'] or '' }}" placeholder="What was this for?">
                </div>

                <button type="submit" class="btn-submit">Update Expense</button>
            </form>

            <div class="auth-footer">
                <a href="{{ url_for('profile') }}" style="color: var(--ink-muted); text-decoration: none; font-size: 0.9rem;">&larr; Back to Profile</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
